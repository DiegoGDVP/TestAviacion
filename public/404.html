<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages with BrowserRouter
    // Save the attempted path and redirect to index.html
    var path = window.location.pathname + window.location.search + window.location.hash;
    sessionStorage.setItem('__spa_redirect', path);
    window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, 2).join('/') + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>

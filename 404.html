<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages with BrowserRouter
    // Save the full attempted path and redirect to site root
    var path = window.location.pathname + window.location.search + window.location.hash;
    sessionStorage.setItem('__spa_redirect', path);
    window.location.replace('/TestAviacion/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
